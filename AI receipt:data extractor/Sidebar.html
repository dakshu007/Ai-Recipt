<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: 'Google Sans', Roboto, Arial, sans-serif;
        font-size: 13px;
        padding: 14px;
        color: #202124;
      }
      textarea {
        width: 100%;
        height: 110px;
        box-sizing: border-box;
        padding: 6px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        font-family: inherit;
        font-size: 13px;
      }
      input[type=file] { margin: 10px 0; font-size: 12px; }
      button {
        background: #4285F4;
        color: #fff;
        border: none;
        padding: 8px 18px;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled { background: #bdbdbd; cursor: default; }
      #status { margin-top: 12px; font-size: 12px; color: #5f6368; min-height: 16px; }
      .divider { text-align: center; color: #9aa0a6; font-size: 11px; margin: 8px 0; }
    </style>
  </head>
  <body>
    <p>Paste messy text:</p>
    <textarea id="rawText" placeholder="e.g. Uber 42.50 June 3, Staples printer paper $18.20..."></textarea>

    <div class="divider">— or —</div>

    <p>Upload a receipt / invoice photo:</p>
    <input type="file" id="fileInput" accept="image/*">
    <br><br>
    <button id="extractBtn" onclick="runExtraction()">Extract to sheet</button>
    <div id="status"></div>

    <script>
      function runExtraction() {
        const btn = document.getElementById('extractBtn');
        const status = document.getElementById('status');
        const text = document.getElementById('rawText').value.trim();
        const fileInput = document.getElementById('fileInput');

        if (!text && fileInput.files.length === 0) {
          status.textContent = 'Paste some text or choose a photo first.';
          return;
        }

        btn.disabled = true;
        status.textContent = 'Extracting…';

        if (fileInput.files.length > 0) {
          const reader = new FileReader();
          reader.onload = function (e) {
            send(text, e.target.result.split(',')[1]);
          };
          reader.readAsDataURL(fileInput.files[0]);
        } else {
          send(text, null);
        }
      }

      function send(text, imageBase64) {
        google.script.run
          .withSuccessHandler(onDone)
          .withFailureHandler(onError)
          .processInput(text, imageBase64);
      }

      function onDone(result) {
        const btn = document.getElementById('extractBtn');
        const status = document.getElementById('status');
        btn.disabled = false;
        if (result.success) {
          status.textContent = '✓ Added ' + result.count + ' row(s) to the sheet.';
          document.getElementById('rawText').value = '';
          document.getElementById('fileInput').value = '';
        } else {
          status.textContent = 'Error: ' + result.error;
        }
      }

      function onError(err) {
        document.getElementById('extractBtn').disabled = false;
        document.getElementById('status').textContent = 'Error: ' + err.message;
      }
    </script>
  </body>
</html>
